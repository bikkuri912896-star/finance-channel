name: Daily Finance Video Upload

on:
  schedule:
    - cron: '0 11 * * *'  # 毎日 11:00 UTC = 20:00 JST
  workflow_dispatch:        # 手動実行ボタン（テスト用）

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # used_topics.json をコミットするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-ipafont
          mkdir -p fonts
          echo "=== Available fonts ==="
          find /usr/share/fonts -name "*.otf" -o -name "*.ttf" | head -20
          FONT=$(find /usr/share/fonts \( -name "*.otf" -o -name "*.ttf" \) | grep -iE "mincho|serif|jp" | head -1)
          if [ -z "$FONT" ]; then
            FONT=$(find /usr/share/fonts \( -name "*.otf" -o -name "*.ttf" \) | head -1)
          fi
          echo "Using font: $FONT"
          cp "$FONT" fonts/yumindb.ttf
          cp "$FONT" fonts/yumin.ttf
          ls -lh fonts/

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up credentials
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN }}'          > youtube_token.json
          printf 'ANTHROPIC_API_KEY=%s\n' '${{ secrets.ANTHROPIC_API_KEY }}' > .env
          printf 'INSTAGRAM_ACCESS_TOKEN=%s\n' '${{ secrets.INSTAGRAM_ACCESS_TOKEN }}' >> .env
          printf 'INSTAGRAM_ACCOUNT_ID=%s\n' '${{ secrets.INSTAGRAM_ACCOUNT_ID }}' >> .env
          printf 'CLOUDINARY_CLOUD_NAME=%s\n' '${{ secrets.CLOUDINARY_CLOUD_NAME }}' >> .env
          printf 'CLOUDINARY_API_KEY=%s\n' '${{ secrets.CLOUDINARY_API_KEY }}' >> .env
          printf 'CLOUDINARY_API_SECRET=%s\n' '${{ secrets.CLOUDINARY_API_SECRET }}' >> .env
          printf 'TWITTER_API_KEY=%s\n' '${{ secrets.TWITTER_API_KEY }}' >> .env
          printf 'TWITTER_API_SECRET=%s\n' '${{ secrets.TWITTER_API_SECRET }}' >> .env
          printf 'TWITTER_ACCESS_TOKEN=%s\n' '${{ secrets.TWITTER_ACCESS_TOKEN }}' >> .env
          printf 'TWITTER_ACCESS_TOKEN_SECRET=%s\n' '${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}' >> .env

      - name: Generate and upload video
        run: python main.py
        env:
          PYTHONIOENCODING: utf-8
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - name: Save updated topic list
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "chore: update used topics [skip ci]"
          git push
